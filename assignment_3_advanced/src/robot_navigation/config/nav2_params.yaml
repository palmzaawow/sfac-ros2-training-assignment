planner_server:
  ros__parameters:
    use_sim_time: true
    planner_plugins: ["GridBased"]
    GridBased:
      ros__parameters:
        plugin: "nav2_navfn_planner/NavfnPlanner"

behavior_server:
  ros__parameters:
    use_sim_time: True
    plugin_lib_names:
      - nav2_spin_behavior
      - nav2_back_up_behavior
      - nav2_wait_behavior 
      - nav2_clear_costmap_service_behavior
      - nav2_follow_path_behavior

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    navigators: ["navigate_to_pose"]
    # plugin_lib_names:
