amcl:
  ros__parameters:
    use_sim_time: true
    base_frame_id: base_link
    odom_frame_id: odom
    scan_topic: scan/out
    min_particles: 500
    max_particles: 2000

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 20.0
    costmap_update_timeout: 0.3
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    odom_topic: "odom"
    progress_checker_plugins: ["progress_checker"] # progress_checker_plugin: "progress_checker" For Humble and older
    goal_checker_plugins: ["goal_checker"] # goal_checker_plugin: "goal_checker" For Galactic and older
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
      stateful: True
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: true
      min_vel_x: 0.0
      max_vel_x: 0.5
      max_vel_theta: 1.0
      acc_lim_x: 1.0
      acc_lim_theta: 1.0
      vx_samples: 20
      vtheta_samples: 40
      sim_time: 2.0
      critics: ["ObstacleFootprintCritic", "GoalAlignCritic", "PathAlignCritic", "PathDistCritic", "GoalDistCritic"]
      ObstacleFootprintCritic.scale: 0.02
      GoalAlignCritic.scale: 24.0
      PathAlignCritic.scale: 32.0
      PathDistCritic.scale: 32.0
      GoalDistCritic.scale: 24.0

